<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  .toggle-group {
    display: flex;
    flex-wrap: nowrap;
    box-sizing: border-box;
  }

  .toggle-item {
    position: relative;
    flex: 1 1 0;
    margin-left: -1px;
    font-size: 16px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    box-sizing: border-box;
    padding: 8px 16px;
    line-height: 1.42857;
    color: #3a5a78;
    background-color: #ffffff;
    border: 1px solid #3a5a78;
    font-family: "HCo Gotham", arial, sans-serif;
    font-weight: 500;
  }

  .toggle-item:first-child {
    margin-left: 0;
  }

  @media (min-width: 768px) {
    .toggle-item {
      flex: 0 0 auto;
      min-width: 160px;
    }
  }

  .toggle-item:hover {
    color: #3a5a78;
    border-color: #4E79A2;
    box-shadow: 0 0 2px 2px rgba(36, 119, 191, 0.5);
    z-index: 2;
  }

  .toggle-item[aria-checked="true"] {
    color: #ffffff;
    border-color: #3a5a78;
    background-color: #4E79A2;
    box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.47);
    z-index: 2;
  }

  .toggle-item:focus,
  .toggle-item:focus-visible {
    border-color: #4E79A2;
    box-shadow: 0 0 2px 2px rgba(36, 119, 191, 0.5);
    outline: 2px solid transparent;
    z-index: 2;
  }

  .toggle-item:active {
    color: #ffffff;
    border-color: #3a5a78;
    background-color: #4E79A2;
    box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.47), 0 0 2px 2px rgba(36, 119, 191, 0.5);
    z-index: 2;
  }
</style>
</head>
<body>

<div class="toggle-group" role="radiogroup">
  <div class="toggle-item" role="radio" aria-checked="false" tabindex="0">yes</div>
  <div class="toggle-item" role="radio" aria-checked="false" tabindex="-1">no</div>
</div>

<script>
  const group = document.querySelector('[role="radiogroup"]');
  const items = Array.from(group.querySelectorAll('[role="radio"]'));

  function selectItem(target) {
    items.forEach(item => {
      const isSelected = item === target;
      item.setAttribute('aria-checked', isSelected);
      item.setAttribute('tabindex', isSelected ? '0' : '-1');
    });
    target.focus();
  }

  items.forEach((item, index) => {
    item.addEventListener('click', () => {
      selectItem(item);
    });

    item.addEventListener('keydown', (e) => {
      let nextIndex = null;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        selectItem(item);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        nextIndex = (index + 1) % items.length;
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        nextIndex = (index - 1 + items.length) % items.length;
      }

      if (nextIndex !== null) {
        selectItem(items[nextIndex]);
      }
    });
  });
</script>

</body>
</html>
